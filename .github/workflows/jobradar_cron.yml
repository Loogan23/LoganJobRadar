name: JobRadar Auto Scanner

on:
  schedule:
    # Executa 3 vezes ao dia (09:00, 15:00 e 19:00 no fuso de Brasília - UTC-3)
    - cron: '0 12,18,22 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo botão no GitHub

jobs:
  scan-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Varredura e Disparar Alertas no Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py run

      - name: Salvar Histórico de Notificações
        run: |
          git config --global user.name "JobRadar Bot"
          git config --global user.email "bot@jobradar.local"
          git add output/notified_jobs.json output/vagas_compativeis.json output/vagas_compativeis.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: atualizar histórico de vagas [skip ci]" && git push)
